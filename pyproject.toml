[project]
name = "pyu"
version = "0.1.0"
description = "Common Python utilities used in various projects."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy~=2.0",
    "opencv-python-headless~=4.11",
    "pillow>=12.2.0",
]

[dependency-groups]
dev = [
    "tqdm>=4.67.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elvout"]
